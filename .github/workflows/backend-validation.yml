name: Backend Validation

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estatesync
          POSTGRES_PASSWORD: estatesync
          POSTGRES_DB: estatesync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estatesync -d estatesync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://estatesync:estatesync@localhost:5432/estatesync_test
      JWT_SECRET: supersecretjwtkey
      JWT_REFRESH_SECRET: supersecretrefreshkey
      NODE_ENV: test
      PORT: 4000
      FRONTEND_URL: ""
      RENDER_EXTERNAL_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Push database schema
        working-directory: backend
        run: npx prisma db push

      - name: Seed test database
        working-directory: backend
        run: node prisma/seed.js

      - name: Start backend
        working-directory: backend
        run: |
          npm start &
          npx wait-on http://127.0.0.1:4000

      - name: Run validation suite
        working-directory: backend
        run: npm test
